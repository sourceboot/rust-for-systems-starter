# NO DEPENDENCIES, EVER — and this empty section is the point, not an oversight.
# Writing the byte readers, the varint, the error type and the b-tree walk yourself
# IS the course; reaching for `rusqlite` or `byteorder` solves a different problem.
[package]
name = "sqlkit"
version = "0.1.0"
edition = "2021"
# No build script, ever: the line below turns cargo's build.rs auto-detection off,
# so nothing of yours runs at compile time — the course's checks compile your
# library and nothing else. Every lab's rubric pins that line (`<mod>.manifest`,
# added 2026-09-17).
build = false

